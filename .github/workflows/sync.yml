name: Sync and alerts

# Runs hourly and decides from the clock which alert is due, so a delayed or dropped run only
# postpones an alert to the next hour. Minute 17 avoids the top of the hour, when GitHub's
# schedule queue is under the highest load.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: Alert to send
        type: choice
        default: auto
        options: [auto, none, morning, evening]

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Until the data token is configured, runs succeed without doing anything, so a fresh
      # fork or setup does not fail every hour. Checked in a step because an empty secret and a
      # missing one look the same there, and the log says which secrets arrived.
      - id: config
        run: |
          for name in DATA_REPO DATA_REPO_TOKEN WANIKANI_TOKEN NTFY_TOPIC; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: empty"; fi
          done
          if [ -n "$DATA_REPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Falta el secreto DATA_REPO_TOKEN; ver docs/setup.md"
          fi
        env:
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          WANIKANI_TOKEN: ${{ secrets.WANIKANI_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.config.outputs.ready == 'true'
        run: npm ci --omit=dev --ignore-scripts
      - if: steps.config.outputs.ready == 'true'
        run: npm run sync -- --slot="$SLOT"
        env:
          SLOT: ${{ inputs.slot || 'auto' }}
          DATA_REPO: ${{ secrets.DATA_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          WANIKANI_TOKEN: ${{ secrets.WANIKANI_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          HUB_URL: ${{ vars.HUB_URL }}
          HUB_TIMEZONE: ${{ vars.HUB_TIMEZONE }}
          ALERT_MORNING_HOUR: ${{ vars.ALERT_MORNING_HOUR }}
          ALERT_EVENING_HOUR: ${{ vars.ALERT_EVENING_HOUR }}
